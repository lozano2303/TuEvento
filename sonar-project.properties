# Configuración de SonarQube Cloud (https://sonarcloud.io/project/overview?id=lozano2303_TuEvento)
# El análisis lo ejecuta GitHub Actions (.github/workflows/ci.yml); el token va en el secret SONAR_TOKEN.
sonar.projectKey=lozano2303_TuEvento
sonar.organization=lozano2303
sonar.projectName=TuEvento
sonar.sourceEncoding=UTF-8

# Código fuente: backend (Java), web y móvil (JS/React)
sonar.sources=TuEventoBackend/tu-evento/src/main/java,TuEventoFrontend/web/src,TuEventoFrontend/movil/src
sonar.tests=TuEventoBackend/tu-evento/src/test/java
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/locales/**,**/assets/**
# Web y móvil aún no tienen tests: se analizan (bugs, vulnerabilidades, duplicados) pero no
# cuentan para la cobertura. Quitar esta línea cuando exista un reporte lcov del frontend.
# La infraestructura de almacenamiento (S3/RustFS) y los schedulers requieren servicios externos
# (MinIO/RustFS, Kafka) y no se cubren con tests unitarios; se excluyen de la cobertura.
sonar.coverage.exclusions=TuEventoFrontend/**,TuEventoBackend/tu-evento/src/main/java/com/capysoft/tuevento/modules/storage/**,TuEventoBackend/tu-evento/src/main/java/com/capysoft/tuevento/modules/payment/infrastructure/scheduler/**,TuEventoBackend/tu-evento/src/main/java/com/capysoft/tuevento/shared/infrastructure/outbox/**,TuEventoBackend/tu-evento/src/main/java/com/capysoft/tuevento/shared/infrastructure/config/**
# Web y móvil se construyen por separado (la imagen de web usa como contexto TuEventoFrontend/web
# y EAS solo sube TuEventoFrontend/movil), así que no pueden importar un módulo común. Las utilidades
# puras que deben comportarse igual en ambas apps se mantienen espejadas a propósito: solo la copia
# móvil se excluye del cálculo de duplicación (sigue analizándose para bugs y seguridad).
sonar.cpd.exclusions=TuEventoFrontend/movil/src/utils/notificationI18n.js,TuEventoFrontend/movil/src/utils/layoutUtils.js

# Backend: binarios y cobertura generados por ./mvnw verify en el job de backend
sonar.java.source=17
sonar.java.binaries=TuEventoBackend/tu-evento/target/classes
sonar.java.test.binaries=TuEventoBackend/tu-evento/target/test-classes
sonar.java.libraries=TuEventoBackend/tu-evento/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=TuEventoBackend/tu-evento/target/site/jacoco/jacoco.xml
