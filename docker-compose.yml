version: '3.8'

services:

  # ── Persistencia ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: tuevento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tuevento-network

  redis:
    image: redis:7-alpine
    container_name: tuevento-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tuevento-network

  # ── Object storage (MinIO) ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: tuevento-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - tuevento-network

  # Crea el bucket y aplica políticas de acceso público por prefijo.
  # Se ejecuta una sola vez al levantar el stack y termina (exit 0).
  #
  # Prefijos públicos (acceso anónimo de lectura):
  #   - profile_picture/*  — avatares de usuario
  #   - event_media/*      — imágenes de evento
  #
  # Prefijos que quedan privados (no se tocan aquí):
  #   - organizer_document/*  — PDFs de solicitud de organizador (sensibles)
  minio-init:
    image: minio/minio:latest
    container_name: tuevento-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/tuevento;
        mc anonymous set download local/tuevento/profile_picture;
        mc anonymous set download local/tuevento/event_media;
        echo "MinIO init complete.";
        exit 0;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - tuevento-network

  # ── Moderación de imágenes ──────────────────────────────────────────────────
  nsfw-classifier:
    build: ./nsfw-service
    container_name: nsfw-classifier
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - THRESHOLD=0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tuevento-network

  # ── Backend (Spring Boot) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./TuEventoBackend/tu-evento
      dockerfile: Dockerfile
    container_name: tuevento-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuevento_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_ACCESS_TOKEN_EXPIRATION=900000
      - APP_JWT_REFRESH_TOKEN_EXPIRATION=604800000

      # Endpoint interno (container-to-container) para upload/delete
      - APP_STORAGE_ENDPOINT=http://minio:9000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # URL pública embebida en presigned URLs — debe ser alcanzable desde el browser
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9010}

      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_ALIAS=${ADMIN_ALIAS}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}

      - NSFW_SERVICE_URL=http://nsfw-classifier:8000
      - NSFW_THRESHOLD=0.4

      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET}
      - SIGHTENGINE_MODELS=${SIGHTENGINE_MODELS}
      - SIGHTENGINE_THRESHOLD=${SIGHTENGINE_THRESHOLD}
      - SIGHTENGINE_NUDITY_THRESHOLD=${SIGHTENGINE_NUDITY_THRESHOLD}

      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      nsfw-classifier:
        condition: service_started
    networks:
      - tuevento-network

  # ── CI / CD ─────────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tuevento-jenkins
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tuevento-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: tuevento-sonarqube
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres
    networks:
      - tuevento-network

  # ── Frontend (React + Vite + nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./TuEventoFrontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: tuevento-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - tuevento-network
    depends_on:
      - backend

# ── Redes ──────────────────────────────────────────────────────────────────────
networks:
  tuevento-network:
    driver: bridge

# ── Volúmenes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  redis_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
