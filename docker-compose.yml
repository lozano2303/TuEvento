services:
  postgres:
    image: postgres:17
    container_name: tuevento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuevento_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tuevento-network

  minio:
    image: minio/minio:latest
    container_name: tuevento-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tuevento-network

  minio-init:
    image: minio/minio:latest
    container_name: tuevento-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/tuevento;
        mc anonymous set download local/tuevento/profile_picture;
        exit 0;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - tuevento-network

  nsfw-classifier:
    build: ./nsfw-service
    container_name: nsfw-classifier
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - tuevento-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tuevento-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8083:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx1g -Xms512m
      - JENKINS_OPTS=--httpPort=8080
      - TESTCONTAINERS_RYUK_DISABLED=true
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tuevento-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: tuevento-sonarqube
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres
    networks:
      - tuevento-network

  redis:
    image: redis:7-alpine
    container_name: tuevento-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tuevento-network

  backend:
    build:
      context: ./TuEventoBackend/tu-evento
      dockerfile: Dockerfile
    container_name: tuevento-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
