version: '3.8'

services:

  # ── Persistencia ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: tuevento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tuevento-network

  postgres-fake-gateway:
    image: postgres:17-alpine
    container_name: fake-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fake_gateway_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_fake_gateway_data:/var/lib/postgresql/data
    networks:
      - tuevento-network

  redis:
    image: redis:7-alpine
    container_name: tuevento-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tuevento-network

  # ── Object storage (MinIO) ──────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: tuevento-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - tuevento-network

  # Crea el bucket y aplica políticas de acceso público por prefijo.
  # Se ejecuta una sola vez al levantar el stack y termina (exit 0).
  #
  # Prefijos públicos (acceso anónimo de lectura):
  #   - profile_picture/*  — avatares de usuario
  #   - event_media/*      — imágenes de evento
  #
  # Prefijos que quedan privados (no se tocan aquí):
  #   - organizer_document/*  — PDFs de solicitud de organizador (sensibles)
  minio-init:
    image: quay.io/minio/minio:latest
    container_name: tuevento-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/tuevento;
        mc anonymous set download local/tuevento/profile_picture;
        mc anonymous set download local/tuevento/event_media;
        echo "MinIO init complete.";
        exit 0;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - tuevento-network

  # Alternativa a MinIO (S3 compatible, escrita en Rust).
  # Se usa con STORAGE_PROVIDER=rustfs; el backend crea el bucket y aplica las
  # políticas públicas al arrancar (no necesita un servicio init).
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.59
    container_name: tuevento-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - tuevento-network

  # ── Moderación de imágenes ──────────────────────────────────────────────────
  nsfw-classifier:
    build: ./nsfw-service
    container_name: nsfw-classifier
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - THRESHOLD=0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tuevento-network

   # ── Fake Payment Gateway ────────────────────────────────────────────────────

  # ── Kafka (KRaft — sin Zookeeper) ──────────────────────────────────────────
  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: tuevento-kafka
    restart: unless-stopped
    ports:
      # Puerto externo para herramientas de desarrollo (ej: kafka-ui, kafkacat).
      # Solo en localhost: quien escribe en los topics decide a quién se envían emails
      - "127.0.0.1:9094:9094"
    environment:
      # Modo KRaft: broker + controller en un solo nodo (suficiente para dev)
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners:
      #   INTERNAL  — contenedores dentro de la red Docker (backend → kafka:9092)
      #   CONTROLLER — comunicación interna KRaft
      #   EXTERNAL  — acceso desde el host (localhost:9094)
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Retención 72 h en dev
      KAFKA_CFG_LOG_RETENTION_HOURS: "72"
      # Auto-crear topics al primer mensaje
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Factor de replicación 1 (dev single-node)
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - tuevento-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  fake-payment-gateway:
    build:
      context: ./fake-payment-gateway
      dockerfile: Dockerfile
    container_name: fake-payment-gateway
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - FAKE_GATEWAY_PORT=4001
      - POSTGRES_HOST=postgres-fake-gateway
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fake_gateway_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PAYMENT_CALLBACK_URL=http://host.docker.internal:8080/api/v1/webhooks/payment
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - ADMIN_API_KEY=${FAKE_GATEWAY_API_KEY:-dev-admin-key-change-in-production}
      - LOG_LEVEL=INFO
    depends_on:
      - postgres-fake-gateway
    networks:
      - tuevento-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Translation Service ────────────────────────────────────────────────────
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: tuevento-libretranslate
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - LT_LOAD_ONLY=es,en,fr,pt
      - LT_THREADS=4
      - LT_UPDATE_MODELS=false
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - tuevento-network

  # ── Backend (Spring Boot) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./TuEventoBackend/tu-evento
      dockerfile: Dockerfile
    container_name: tuevento-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./TuEventoBackend/tu-evento/src/main/resources/keys:/run/secrets:ro
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuevento_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      # RS256: clave privada montada desde el host; si no existe, el perfil dev usa un par en memoria
      - APP_JWT_PRIVATE_KEY_PATH=file:/run/secrets/jwt-private.pem
      - APP_JWT_ACCESS_TOKEN_EXPIRATION=900000
      - APP_JWT_REFRESH_TOKEN_EXPIRATION=604800000

      # Endpoint interno (container-to-container) para upload/delete
      - APP_STORAGE_ENDPOINT=http://minio:9000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # URL pública embebida en presigned URLs — debe ser alcanzable desde el browser
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}

      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_ALIAS=${ADMIN_ALIAS}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}

      - NSFW_SERVICE_URL=http://nsfw-classifier:8000
      - NSFW_THRESHOLD=0.4

      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET}
      - SIGHTENGINE_MODELS=${SIGHTENGINE_MODELS}
      - SIGHTENGINE_THRESHOLD=${SIGHTENGINE_THRESHOLD}
      - SIGHTENGINE_NUDITY_THRESHOLD=${SIGHTENGINE_NUDITY_THRESHOLD}

      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000

      # Translation service configuration
      - TRANSLATION_LIBRETRANSLATE_BASE_URL=http://libretranslate:5000
      - TRANSLATION_PROTECTED_TERMS=${TRANSLATION_PROTECTED_TERMS:-Tu Evento}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Las notificaciones las envía notification-service (local = dentro del backend)
      - NOTIFICATION_MODE=remote
      # Eventos y perfiles leen sedes y ciudades de geolocation-service (el backend ya no tiene ese módulo)
      - GEOLOCATION_SERVICE_URL=http://geolocation-service:8087
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      nsfw-classifier:
        condition: service_started
      libretranslate:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tuevento-network


  # ── API Gateway (Spring Cloud Gateway) ─────────────────────────────────────
  # Los frontends apuntan a :8090 (gateway). El monolito en :8080 es interno.
  # En Fases 1-5 el gateway irá enrutando prefijos a cada microservicio extraído.
  gateway:
    build:
      context: ./TuEventoBackend/gateway
      dockerfile: Dockerfile
    container_name: tuevento-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - GATEWAY_PORT=8090
      - MONOLITH_URI=http://backend:8080
      # /api/v1/storage va al microservicio; para volver al monolito, quitar esta variable
      - STORAGE_SERVICE_URI=http://storage-service:8085
      # /api/v1/geolocation solo lo sirve el microservicio (el monolito ya no tiene ese módulo)
      - GEOLOCATION_SERVICE_URI=http://geolocation-service:8087
      # /api/v1/notifications va al microservicio; para volver al monolito, quitar esta variable
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_started
      storage-service:
        condition: service_started
      geolocation-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_started
    networks:
      tuevento-network:
        # Nombre que usa el nginx del frontend (mismo que en producción)
        aliases:
          - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Microservicio de Archivos (primera extracción) ─────────────────────────
  storage-service:
    build:
      # El contexto incluye tuevento-common, que se compila dentro de la imagen
      context: ./TuEventoBackend/services
      dockerfile: storage-service/Dockerfile
    container_name: tuevento-storage-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - STORAGE_SERVICE_PORT=8085
      # Misma base que el monolito (las tablas de storage las migra su Liquibase)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuevento_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWK_SET_URI=http://backend:8080/.well-known/jwks.json
      # Lista de revocación de JWT (fail-closed): misma instancia que el backend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Mismo proveedor y bucket que el backend: los dos leen y escriben los mismos objetos
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - APP_STORAGE_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL:-http://localhost:9100}
      - NSFW_SERVICE_URL=http://nsfw-classifier:8000
      - NSFW_THRESHOLD=0.4
      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      minio:
        condition: service_started
      # El backend migra las tablas y publica el JWKS
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tuevento-network

  # ── Microservicio de notificaciones ────────────────────────────────────────
  # Recibe por Kafka las notificaciones que decide el backend (NOTIFICATION_MODE=remote),
  # las guarda en la misma base, envía el email y devuelve los pushes al /ws del backend.
  notification-service:
    build:
      context: ./TuEventoBackend/services
      dockerfile: notification-service/Dockerfile
    container_name: tuevento-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuevento_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWK_SET_URI=http://backend:8080/.well-known/jwks.json
      # Lista de revocación de JWT (fail-closed): misma instancia que el backend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - NOTIFICATION_EMAIL_ENABLED=${NOTIFICATION_EMAIL_ENABLED:-true}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      # El backend migra las tablas y publica el JWKS
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tuevento-network

  # ── Microservicio de geolocalización ───────────────────────────────────────
  # Departamentos, ciudades y sedes sobre la misma base que el backend.
  geolocation-service:
    build:
      context: ./TuEventoBackend/services
      dockerfile: geolocation-service/Dockerfile
    container_name: tuevento-geolocation-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuevento_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWK_SET_URI=http://backend:8080/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_started
      # El backend migra las tablas (y sus datos iniciales) y publica el JWKS
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tuevento-network

  # ── CI / CD ─────────────────────────────────────────────────────────────────
  # Inactivos: el CI corre en GitHub Actions + SonarQube Cloud. Solo arrancan con
  # `docker compose --profile ci up -d jenkins sonarqube` y no se reinician solos.
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tuevento-jenkins
    profiles: ["ci"]
    restart: "no"
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tuevento-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: tuevento-sonarqube
    profiles: ["ci"]
    restart: "no"
    ports:
      - "9002:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres
    networks:
      - tuevento-network

  # ── Frontend (React + Vite + nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./TuEventoFrontend/web
      dockerfile: Dockerfile
      args:
        # La web entra por el gateway (API REST y /ws)
        VITE_API_URL: http://localhost:8090/api/v1
    container_name: tuevento-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - tuevento-network
    depends_on:
      - gateway

# ── Redes ──────────────────────────────────────────────────────────────────────
networks:
  tuevento-network:
    driver: bridge

# ── Volúmenes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  postgres_fake_gateway_data:
  minio_data:
  rustfs_data:
  redis_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  kafka_data:
  libretranslate-models:

