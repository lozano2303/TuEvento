# Keep the scheme set by the TLS proxy in front (Nginx Proxy Manager);
# fall back to this server's scheme when the request comes in directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Backend accepts multipart uploads up to 12MB (spring.servlet.multipart.max-request-size)
    client_max_body_size 12m;

    # Vite emits content-hashed files under /assets — safe to cache long-term.
    # ^~ so the static-file regex below never takes over this prefix.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A request for a file (by extension) that does not exist is a 404. Without this the
    # SPA fallback below answered with index.html (text/html), so a broken image or script
    # looked like a 200 and failed silently in the browser.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|css|js|mjs|map|json|txt|xml|webmanifest|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
    }

    # SPA routes (no file extension) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ^~ keeps API paths away from the static-file regex above.
    # Todo entra por el API gateway, que reparte entre el monolito y los microservicios.
    location ^~ /api {
        proxy_pass http://api-gateway:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # STOMP over SockJS (notifications, seat updates)
    location ^~ /ws {
        proxy_pass http://api-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
