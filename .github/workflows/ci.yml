# Integración continua de TuEvento: tests del backend + análisis en SonarQube Cloud,
# build de la web y bundle de la app móvil. Reemplaza al pipeline de Jenkins (inactivo).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama/PR cuando llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend (tests + SonarQube)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TuEventoBackend/tu-evento
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial completo para blame y código nuevo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tests y cobertura (JaCoCo)
        run: ./mvnw -B verify

      - name: Copiar dependencias para el análisis Java
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=compile

      - name: Análisis SonarQube Cloud
        # Los PRs desde forks no reciben secrets: se omite el análisis en ese caso
        if: ${{ env.SONAR_TOKEN != '' }}
        # Fijada por SHA: esta acción de terceros recibe el SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  microservices:
    name: Microservicios (storage, notifications + api-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Los servicios no traen mvnw propio: se usa el del monolito
      - name: tuevento-common (librería compartida)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/services/tuevento-common/pom.xml install

      - name: storage-service (tests)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/services/storage-service/pom.xml verify

      - name: notification-service (tests)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/services/notification-service/pom.xml verify

      - name: geolocation-service (tests)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/services/geolocation-service/pom.xml verify

      - name: identity-service (tests)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/services/identity-service/pom.xml verify

      - name: api-gateway (build)
        run: TuEventoBackend/tu-evento/mvnw -B -f TuEventoBackend/gateway/pom.xml package

      # Comprueba que las imágenes de producción se construyen desde cero
      - name: Imagen de storage-service
        run: docker build -f TuEventoBackend/services/storage-service/Dockerfile TuEventoBackend/services

      - name: Imagen de notification-service
        run: docker build -f TuEventoBackend/services/notification-service/Dockerfile TuEventoBackend/services

      - name: Imagen de geolocation-service
        run: docker build -f TuEventoBackend/services/geolocation-service/Dockerfile TuEventoBackend/services

      - name: Imagen de identity-service
        run: docker build -f TuEventoBackend/services/identity-service/Dockerfile TuEventoBackend/services

      - name: Imagen de api-gateway
        run: docker build TuEventoBackend/gateway

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TuEventoFrontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TuEventoFrontend/web/package-lock.json

      - run: npm ci
      # Lint informativo: aún hay avisos en código existente (ver docs/frontend-quality.md)
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build

  mobile:
    name: Móvil (bundle Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TuEventoFrontend/movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TuEventoFrontend/movil/package-lock.json

      - run: npm ci
      # Lint informativo: aún hay avisos en código existente (ver docs/frontend-quality.md)
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      # Genera el bundle JS de Android: falla si hay imports rotos o errores de sintaxis
      - run: npx expo export --platform android --output-dir dist
