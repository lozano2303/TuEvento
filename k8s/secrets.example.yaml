# Plantilla del Secret de Kubernetes. NO pongas valores reales aquí.
#
# Nota: el k8s/secrets.yaml que estuvo versionado hasta octubre de 2026 solo
# contenía datos de prueba (postgres/secret, minioadmin, test-google-client-id,
# test-facebook-client-id, testpassword, test@gmail.com, un jwt-secret de
# desarrollo...). Ninguno corresponde a credenciales reales de algún entorno,
# por lo que se consideran falsos positivos. El archivo real ya no se versiona.
#
# Uso:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml   # k8s/secrets.yaml está en .gitignore
#   # reemplaza cada CHANGE_ME y aplica:
#   kubectl apply -f k8s/secrets.yaml -n <namespace>
#
# stringData acepta texto plano; Kubernetes lo codifica en base64 al aplicarlo.
apiVersion: v1
kind: Secret
metadata:
  name: tu-evento-secrets
type: Opaque
stringData:
  db-username: CHANGE_ME
  db-password: CHANGE_ME
  minio-access-key: CHANGE_ME
  minio-secret-key: CHANGE_ME
  # HS256 anterior: solo valida tokens emitidos antes de RS256; se puede quitar tras 7 días
  jwt-secret: CHANGE_ME_AT_LEAST_256_BITS
  google-client-id: CHANGE_ME
  google-client-secret: CHANGE_ME
  facebook-client-id: CHANGE_ME
  facebook-client-secret: CHANGE_ME
  admin-email: CHANGE_ME
  admin-password: CHANGE_ME
  admin-alias: CHANGE_ME
  mail-username: CHANGE_ME
  mail-password: CHANGE_ME
---
# Claves RS256 del JWT, montadas en /etc/jwt-keys/ (no van al repositorio):
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
#   kubectl create secret generic jwt-rsa-keys -n <namespace> #     --from-file=jwt-private.pem=./jwt-private.pem
