apiVersion: apps/v1
kind: Deployment
metadata:
  name: tu-evento-backend
  labels:
    app: tu-evento-backend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: tu-evento-backend
  template:
    metadata:
      labels:
        app: tu-evento-backend
    spec:
      containers:
      - name: tu-evento-backend
        image: jhampier23/tu-evento:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: jwt-secret
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/tuevento"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: db-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: db-password
        - name: MINIO_ENDPOINT
          value: "http://minio-service:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: minio-secret-key
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: google-client-secret
        - name: FACEBOOK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: facebook-client-id
        - name: FACEBOOK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: facebook-client-secret
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: admin-email
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: admin-password
        - name: ADMIN_ALIAS
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: admin-alias
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: mail-username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tu-evento-secrets
              key: mail-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
