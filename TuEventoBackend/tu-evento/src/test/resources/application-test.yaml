spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

app:
  jwt:
    secret: test-secret-key-for-jenkins-ci-only-32chars
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  mail:
    from: test@tuevento.com
  frontend:
    base-url: http://localhost:5173
  verification:
    base-url: http://localhost:5173/verify-email
  password-reset:
    base-url: http://localhost:5173/reset-password
