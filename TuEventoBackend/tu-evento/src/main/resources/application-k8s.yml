spring:
  datasource:
    url: jdbc:postgresql://postgres-service:5432/tuevento
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
      roles: ANONYMOUS

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  storage:
    enabled: false
    endpoint: http://minio-service:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    region: us-east-1
    bucket-default: tuevento
  oauth:
    # Allowed destinations for the 302 redirect after OAuth callback (web flow).
    # The token travels in the URL, so only whitelisted origins are permitted.
    # Set OAUTH_FRONTEND_REDIRECT_URIS to comma-separated frontend login page URLs.
    # Example: "https://tuevento.app/login,https://www.tuevento.app/login"
    allowed-frontend-redirect-uris: "${OAUTH_FRONTEND_REDIRECT_URIS:http://localhost:3000/login}"
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      # Must match the redirect_uri registered in Google Cloud Console for the production app.
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID}
      client-secret: ${FACEBOOK_CLIENT_SECRET}
      # Must match the redirect_uri registered in Facebook for Developers for the production app.
      redirect-uri: ${FACEBOOK_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/facebook/callback}
      auth-uri: https://www.facebook.com/v18.0/dialog/oauth
      token-uri: https://graph.facebook.com/v18.0/oauth/access_token
      profile-uri: https://graph.facebook.com/me
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    alias: ${ADMIN_ALIAS}
  mail:
    from: ${MAIL_USERNAME}
  cors:
    # Controls which browser origins can read JSON API responses (including OAuth callback).
    # Set CORS_ALLOWED_ORIGINS to the actual frontend domain(s) in production.
    # Example: "https://tuevento.app,https://www.tuevento.app"
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
  profile:
    # storedFileId of the system default avatar (set by ProfileDataInitializer on startup).
    # Must match the actual ID in the stored_file table for the DEFAULT_AVATAR record.
    default-avatar-stored-file-id: ${APP_PROFILE_DEFAULT_AVATAR_ID:1}