spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://postgres-service:5432/tuevento
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # El driver de PostgreSQL envía cada lote de inserts como un único INSERT multi-fila
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
      roles: ANONYMOUS

app:
  qr:
    secret: ${QR_SECRET:${JWT_SECRET}}
    expiration: ${QR_EXPIRATION:60000}
  cors:
    # Controls which browser origins can read JSON API responses (including OAuth callback).
    # Set CORS_ALLOWED_ORIGINS to the actual frontend domain(s) in production.
    # Example: "https://tuevento.app,https://www.tuevento.app"
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"