databaseChangeLog:
  # First, clear any existing theme translations from old migration
  - changeSet:
      id: 096-clear-old-theme-translations
      author: capysoft
      changes:
        - delete:
            tableName: theme_translation
            where: "source = 'MANUAL'"
  
  # PRINCIPAL Theme Translations
  - changeSet:
      id: 096-seed-theme-translation-principal-en
      author: capysoft
      changes:
        - insert:
            tableName: theme_translation
            columns:
              - column:
                  name: theme_id
                  valueComputed: "(SELECT theme_id FROM theme WHERE name = 'PRINCIPAL')"
              - column:
                  name: language_id
                  valueComputed: "(SELECT language_id FROM language WHERE code = 'en')"
              - column:
                  name: translated_name
                  value: "Principal"
              - column:
                  name: translated_description
                  value: "Official Your Event theme — platform identity"
              - column:
                  name: source
                  value: "MANUAL"
  - changeSet:
      id: 096-seed-theme-translation-principal-fr
