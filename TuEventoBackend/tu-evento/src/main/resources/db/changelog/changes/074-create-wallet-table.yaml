databaseChangeLog:
  - changeSet:
      id: 074-create-wallet-table
      author: capysoft
      changes:
        - createTable:
            tableName: wallet
            columns:
              - column:
                  name: wallet_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: balance
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                  defaultValue: "COP"
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
        - sql:
            sql: "ALTER TABLE wallet ADD CONSTRAINT chk_wallet_balance CHECK (balance >= 0);"
        - sql:
            sql: "ALTER TABLE wallet ADD CONSTRAINT chk_wallet_currency CHECK (currency IN ('COP'));"
        - createIndex:
            tableName: wallet
            indexName: idx_wallet_user_id
            columns:
              - column:
                  name: user_id
