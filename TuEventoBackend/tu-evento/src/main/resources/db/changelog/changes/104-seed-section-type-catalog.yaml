databaseChangeLog:
  # Catálogo de tipos de sección (nombres en español, que es el idioma del editor de layout).
  # Idempotente: cada tipo se inserta solo si no existe uno con el mismo nombre.
  - changeSet:
      id: 104-seed-section-type-palco-diamante
      author: capysoft
      changes:
        - sql:
            sql: >-
              INSERT INTO section_type (name, active, category)
              SELECT 'Palco Diamante', true, 'PALCO'
              WHERE NOT EXISTS (SELECT 1 FROM section_type WHERE name = 'Palco Diamante');
