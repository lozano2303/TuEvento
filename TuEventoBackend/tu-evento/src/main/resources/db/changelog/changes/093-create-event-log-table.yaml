databaseChangeLog:
  - changeSet:
      id: 093-create-event-log-table
      author: capysoft
      changes:
        - createTable:
            tableName: event_log
            columns:
              - column:
                  name: log_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_event_log
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: TEXT
              - column:
                  name: new_value
                  type: TEXT
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: event_log
            baseColumnNames: event_id
            constraintName: fk_event_log_event
            referencedTableName: event
            referencedColumnNames: event_id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_event_log_event_id
            tableName: event_log
            columns:
              - column:
                  name: event_id

        - createIndex:
            indexName: idx_event_log_event_action_time
            tableName: event_log
            columns:
              - column:
                  name: event_id
              - column:
                  name: action
              - column:
                  name: occurred_at

      rollback:
        - dropTable:
            tableName: event_log
