databaseChangeLog:
  - changeSet:
      id: 072-create-refund-table
      author: capysoft
      changes:
        - createTable:
            tableName: refund
            columns:
              - column:
                  name: refund_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: "REQUESTED"
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: requested_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
        - addForeignKeyConstraint:
            baseTableName: refund
            baseColumnNames: payment_id
            referencedTableName: payment
            referencedColumnNames: payment_id
            constraintName: fk_refund_payment
        - sql:
            sql: "ALTER TABLE refund ADD CONSTRAINT chk_refund_status CHECK (status IN ('REQUESTED', 'APPROVED', 'PROCESSED', 'FAILED'));"
        - createIndex:
            tableName: refund
            indexName: idx_refund_payment_id
            columns:
              - column:
                  name: payment_id
