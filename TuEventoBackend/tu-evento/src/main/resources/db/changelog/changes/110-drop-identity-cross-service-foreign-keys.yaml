databaseChangeLog:
  # Fase 4 (Identidad): quita las FKs que cruzan la frontera de Identidad. Cada servicio guarda
  # los IDs de los demás como valores planos y los valida por puerto (ver infrastructure/client/),
  # así cada uno podrá vivir en su propio esquema o base. No borra columnas ni datos: solo
  # restricciones. Los usuarios nunca se borran físicamente (las bajas son lógicas), así que no se
  # pierde ningún ON DELETE en uso (el único distinto de NO ACTION era fk_seat_reserved_by, SET NULL).
  #
  # Un changeSet por FK, idempotente: si la restricción ya no existe se marca como ejecutado.
  # El rollback la vuelve a crear con el mismo nombre y la misma regla.
  - changeSet:
      id: 110-drop-fk-stored-file-uploaded-by
      author: capysoft
      comment: "Archivos: stored_file.uploaded_by → app_user.user_id"
      preConditions:
        - onFail: MARK_RAN
        - foreignKeyConstraintExists:
            foreignKeyTableName: stored_file
            foreignKeyName: fk_stored_file_uploaded_by
      changes:
        - dropForeignKeyConstraint:
            baseTableName: stored_file
            constraintName: fk_stored_file_uploaded_by
      rollback:
        - addForeignKeyConstraint:
            baseTableName: stored_file
            baseColumnNames: uploaded_by
            referencedTableName: app_user
            referencedColumnNames: user_id
            constraintName: fk_stored_file_uploaded_by
  - changeSet:
      id: 110-drop-fk-storage-operation-log-performed-by
