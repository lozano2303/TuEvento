databaseChangeLog:
  - changeSet:
      id: 099-update-theme-principal-name
      author: capysoft
      changes:
        - update:
            tableName: theme
            columns:
              - column:
                  name: name
                  value: "Principal"
              - column:
                  name: description
                  value: "Tema oficial de Tu Evento — identidad de la plataforma"
            where: "name = 'PRINCIPAL'"

  - changeSet:
      id: 099-update-theme-dark-name
      author: capysoft
      changes:
        - update:
            tableName: theme
            columns:
              - column:
                  name: name
                  value: "Oscuro"
              - column:
                  name: description
                  value: "Tema oscuro con grises profundos y acentos sutiles"
            where: "name = 'DARK'"

  - changeSet:
      id: 099-update-theme-light-name
      author: capysoft
      changes:
        - update:
            tableName: theme
            columns:
              - column:
                  name: name
                  value: "Claro"
              - column:
                  name: description
                  value: "Tema claro y limpio con fondos blancos y grises suaves"
            where: "name = 'LIGHT'"

  - changeSet:
      id: 099-update-theme-pastel-name
      author: capysoft
