databaseChangeLog:
  # Traducciones manuales del catálogo (en/pt/fr). Solo se muestran al usuario final, en las
  # etiquetas con el nombre de la sección; el editor de layout usa siempre el nombre en español.
  - changeSet:
      id: 105-seed-section-type-translation-palco-diamante-en
      author: capysoft
      changes:
        - sql:
            sql: >-
              INSERT INTO section_type_translation (section_type_id, language_id, translated_name, source, status)
              SELECT st.section_type_id, l.language_id, 'Diamond Box', 'MANUAL', 'published'
              FROM section_type st, language l
              WHERE st.name = 'Palco Diamante' AND l.code = 'en'
              AND NOT EXISTS (SELECT 1 FROM section_type_translation t
                              WHERE t.section_type_id = st.section_type_id AND t.language_id = l.language_id);
  - changeSet:
      id: 105-seed-section-type-translation-palco-diamante-pt
