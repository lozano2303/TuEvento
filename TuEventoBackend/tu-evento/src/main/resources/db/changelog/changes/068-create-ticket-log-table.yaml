databaseChangeLog:
  - changeSet:
      id: 068-create-ticket-log-table
      author: capysoft
      changes:
        - createTable:
            tableName: ticket_log
            columns:
              - column:
                  name: ticket_log_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: old_status
                  type: VARCHAR(20)
              - column:
                  name: new_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: VARCHAR(100)
              - column:
                  name: reason
                  type: VARCHAR(255)
        - addForeignKeyConstraint:
            baseTableName: ticket_log
            baseColumnNames: ticket_id
            referencedTableName: ticket
            referencedColumnNames: ticket_id
            constraintName: fk_ticket_log_ticket
        - sql:
            sql: "ALTER TABLE ticket_log ADD CONSTRAINT chk_ticket_log_old_status CHECK (old_status IS NULL OR old_status IN ('PENDING', 'PROCESSING', 'PAID', 'REFUNDED', 'USED', 'CANCELLED'));"
        - sql:
            sql: "ALTER TABLE ticket_log ADD CONSTRAINT chk_ticket_log_new_status CHECK (new_status IN ('PENDING', 'PROCESSING', 'PAID', 'REFUNDED', 'USED', 'CANCELLED'));"
