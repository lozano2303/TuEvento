databaseChangeLog:
  # Tablas de traducción creadas en 090 y 091 que nunca se usaron: ningún caso de uso inyecta sus
  # repositorios, ningún handler de traducción las rellena y ninguna tabla las referencia. Se borran
  # antes de extraer el servicio de localización para no repartir entre dominios tablas muertas.
  # event_comment_reply_translation además quedó huérfana cuando 092 borró event_comment_reply.
  - changeSet:
      id: 108-drop-action-translation
      author: capysoft
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: action_translation
      changes:
        - dropTable:
            tableName: action_translation
            cascadeConstraints: true

  - changeSet:
