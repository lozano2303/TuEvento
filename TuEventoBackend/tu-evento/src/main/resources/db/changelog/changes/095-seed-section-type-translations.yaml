databaseChangeLog:
  # English Translations
  # EN Translations
  - changeSet:
      id: 095-seed-section-type-translation-general-en-v2
      author: capysoft
      changes:
        - insert:
            tableName: section_type_translation
            columns:
              - column:
                  name: section_type_id
                  valueComputed: "(SELECT section_type_id FROM section_type WHERE name = 'General')"
              - column:
                  name: language_id
                  valueComputed: "(SELECT language_id FROM language WHERE code = 'en')"
              - column:
                  name: translated_name
                  value: "General"
              - column:
                  name: source
                  value: "MANUAL"
