# ============================================================
# application-prod.yml — Perfil de Producción (Render / VPS con Docker)
# ============================================================
# Este archivo se activa cuando SPRING_PROFILES_ACTIVE=prod
# Todas las configuraciones sensibles se leen desde variables
# de entorno — NUNCA colocar valores reales aquí.
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  # Render termina TLS antes de llegar al contenedor (TLS offloading).
  # forward-headers-strategy expone el esquema HTTPS correcto en los
  # redirect URIs de OAuth y en los presigned URLs de S3.
  forward-headers-strategy: framework
  # Never leak internals in Spring's default error responses
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    # Render inyecta DATABASE_URL en formato postgres:// automáticamente.
    # SPRING_DATASOURCE_URL debe configurarse manualmente en Render
    # con el formato jdbc:postgresql:// (ver DEPLOYMENT.md sección 3.3.2)
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Render free tier PostgreSQL tiene límite de 25 conexiones
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # El driver de PostgreSQL envía cada lote de inserts como un único INSERT multi-fila
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      # validate: Liquibase gestiona el esquema; Hibernate solo verifica
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # ── Redis — Upstash (TLS requerido) ──────────────────────
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_REDIS_SSL:true}
      timeout: 2000ms
      connect-timeout: 2000ms

  # ── Sesiones en Redis ─────────────────────────────────────
  session:
    store-type: redis
    timeout: 86400s   # 24 horas

  # ── Kafka (deshabilitado en Fase 1 — habilitar en Fase 3) ─
  # Si el arranque falla por Kafka, descomentar:
  # autoconfigure:
  #   exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.capysoft: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    liquibase: INFO
  pattern:
    # Formato estructurado, útil para los logs de Render
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── SpringDoc / Swagger ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui
    enabled: ${SWAGGER_ENABLED:false}

# ── Actuator: solo /actuator/health, sin detalles ─────────
management:
  endpoints:
    web:
      exposure:
        include: health
      # No /actuator index page listing the exposed endpoints
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

app:

  # ── QR de tickets ─────────────────────────────────────────
  qr:
    secret: ${QR_SECRET:${JWT_SECRET}}
    expiration: ${QR_EXPIRATION:60000}    # 60 segundos

  # ── CORS ──────────────────────────────────────────────────
  # En producción solo se permite el dominio del frontend
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"

# ── Pasarela de pagos ─────────────────────────────────────
payment:
  gateway: ${PAYMENT_GATEWAY:fake}
  fake-gateway:
    url: ${FAKE_GATEWAY_URL}
    api-key: ${FAKE_GATEWAY_API_KEY}
  webhook:
    secret: ${WEBHOOK_SECRET}
