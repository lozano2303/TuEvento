# ============================================================
# application-prod.yml — Perfil de Producción (Render / VPS con Docker)
# ============================================================
# Este archivo se activa cuando SPRING_PROFILES_ACTIVE=prod
# Todas las configuraciones sensibles se leen desde variables
# de entorno — NUNCA colocar valores reales aquí.
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  # Render termina TLS antes de llegar al contenedor (TLS offloading).
  # forward-headers-strategy expone el esquema HTTPS correcto en los
  # redirect URIs de OAuth y en los presigned URLs de S3.
  forward-headers-strategy: framework
  # Never leak internals in Spring's default error responses
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    # Render inyecta DATABASE_URL en formato postgres:// automáticamente.
    # SPRING_DATASOURCE_URL debe configurarse manualmente en Render
    # con el formato jdbc:postgresql:// (ver DEPLOYMENT.md sección 3.3.2)
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Render free tier PostgreSQL tiene límite de 25 conexiones
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # validate: Liquibase gestiona el esquema; Hibernate solo verifica
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # ── Redis — Upstash (TLS requerido) ──────────────────────
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_REDIS_SSL:true}
      timeout: 2000ms
      connect-timeout: 2000ms

  # ── Sesiones en Redis ─────────────────────────────────────
  session:
    store-type: redis
    timeout: 86400s   # 24 horas

  # ── Mail SMTP ─────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  # ── Kafka (deshabilitado en Fase 1 — habilitar en Fase 3) ─
  # Si el arranque falla por Kafka, descomentar:
  # autoconfigure:
  #   exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.capysoft: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    liquibase: INFO
  pattern:
    # Formato estructurado, útil para los logs de Render
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── SpringDoc / Swagger ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui
    enabled: ${SWAGGER_ENABLED:false}

# ── Actuator: solo /actuator/health, sin detalles ─────────
management:
  endpoints:
    web:
      exposure:
        include: health
      # No /actuator index page listing the exposed endpoints
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # SMTP availability must not mark the app as down
    mail:
      enabled: false

# ── MinIO / AWS S3 ─────────────────────────────────────────
minio:
  public-url: ${MINIO_PUBLIC_URL}

app:
  # ── JWT ───────────────────────────────────────────────────
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000       # 15 minutos
    refresh-token-expiration: 604800000   # 7 días

  # ── QR de tickets ─────────────────────────────────────────
  qr:
    secret: ${QR_SECRET:${JWT_SECRET}}
    expiration: ${QR_EXPIRATION:60000}    # 60 segundos

  # ── Almacenamiento S3 ─────────────────────────────────────
  storage:
    enabled: true
    endpoint: ${APP_STORAGE_ENDPOINT}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    region: us-east-1
    bucket-default: tuevento
    # Strategy de almacenamiento: minio (por defecto) | rustfs
    provider: ${STORAGE_PROVIDER:minio}
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
      # Host público que firma las presigned URLs — debe ser alcanzable desde el navegador
      public-url: ${RUSTFS_PUBLIC_URL:${RUSTFS_ENDPOINT:http://rustfs:9000}}
      access-key: ${RUSTFS_ACCESS_KEY}
      secret-key: ${RUSTFS_SECRET_KEY}
      region: us-east-1

  # ── OAuth ─────────────────────────────────────────────────
  oauth:
    # Exact URLs the browser may be sent to after OAuth (the web sends <origin>/login).
    # Falls back to the CORS origins for backwards compatibility with Render.
    allowed-frontend-redirect-uris: "${APP_OAUTH_ALLOWED_FRONTEND_REDIRECT_URIS:${APP_CORS_ALLOWED_ORIGINS}}"
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      # Full callback URL (https://<domain>/api/v1/auth/oauth/google/callback), used as-is.
      redirect-uri: ${APP_OAUTH_GOOGLE_REDIRECT_URI}
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID}
      client-secret: ${FACEBOOK_CLIENT_SECRET}
      # Full callback URL (https://<domain>/api/v1/auth/oauth/facebook/callback), used as-is by
      # the Facebook dialog and the code exchange. Register exactly this value in Meta.
      redirect-uri: ${APP_OAUTH_FACEBOOK_REDIRECT_URI}
      auth-uri: https://www.facebook.com/v18.0/dialog/oauth
      token-uri: https://graph.facebook.com/v18.0/oauth/access_token
      profile-uri: https://graph.facebook.com/me

  # ── Admin inicial ──────────────────────────────────────────
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    alias: ${ADMIN_ALIAS:AdminTuEvento}

  # ── Correo ────────────────────────────────────────────────
  mail:
    from: ${MAIL_USERNAME}

  # ── CORS ──────────────────────────────────────────────────
  # En producción solo se permite el dominio del frontend
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"

  # ── Google OAuth (cliente frontend) ───────────────────────
  google:
    client-id: ${GOOGLE_CLIENT_ID}

  # ── Perfil por defecto ─────────────────────────────────────
  profile:
    default-avatar-stored-file-id: ${APP_PROFILE_DEFAULT_AVATAR_ID:1}

# ── Moderación de imágenes ────────────────────────────────
moderation:
  nsfw:
    url: ${NSFW_SERVICE_URL:http://localhost:8001}
    threshold: ${NSFW_THRESHOLD:0.6}
  sightengine:
    api-user: ${SIGHTENGINE_API_USER}
    api-secret: ${SIGHTENGINE_API_SECRET}
    models: ${SIGHTENGINE_MODELS:gore,nudity,weapon}
    threshold: ${SIGHTENGINE_THRESHOLD:0.6}
    nudity-threshold: ${SIGHTENGINE_NUDITY_THRESHOLD:0.15}

# ── Pasarela de pagos ─────────────────────────────────────
payment:
  gateway: ${PAYMENT_GATEWAY:fake}
  fake-gateway:
    url: ${FAKE_GATEWAY_URL}
  webhook:
    secret: ${WEBHOOK_SECRET}

# ── Notificaciones ────────────────────────────────────────
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
