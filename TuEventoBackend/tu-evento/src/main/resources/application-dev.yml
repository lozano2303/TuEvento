spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

minio:
  # Public-facing URL embedded in presigned URLs sent to the browser.
  # Must differ from app.storage.endpoint when MinIO runs inside Docker.
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  storage:
    enabled: true
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    region: us-east-1
    bucket-default: tuevento
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${APP_OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080}/api/v1/auth/oauth/google/callback
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID}
      client-secret: ${FACEBOOK_CLIENT_SECRET}
      redirect-uri: ${APP_OAUTH_FACEBOOK_REDIRECT_URI:http://localhost:8080}/api/v1/auth/oauth/facebook/callback
      auth-uri: https://www.facebook.com/v18.0/dialog/oauth
      token-uri: https://graph.facebook.com/v18.0/oauth/access_token
      profile-uri: https://graph.facebook.com/me
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    alias: ${ADMIN_ALIAS}
  mail:
    from: ${MAIL_USERNAME}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

moderation:
  nsfw:
    url: ${NSFW_SERVICE_URL:http://localhost:8001}
    threshold: ${NSFW_THRESHOLD:0.4}
  sightengine:
    api-user: ${SIGHTENGINE_API_USER}
    api-secret: ${SIGHTENGINE_API_SECRET}
    models: ${SIGHTENGINE_MODELS:gore,nudity,weapon}
    threshold: ${SIGHTENGINE_THRESHOLD:0.4}
    nudity-threshold: ${SIGHTENGINE_NUDITY_THRESHOLD:0.15}
