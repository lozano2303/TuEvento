spring:
  application:
    name: tu-evento
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # La lista de revocación de tokens se consulta en cada petición y falla cerrada: sin un timeout corto,
  # un Redis colgado retiene cada hilo HTTP 60 s (valor por defecto de Lettuce) antes del 503
  data:
    redis:
      # Same REDIS_HOST/REDIS_PORT the compose files and the microservices use; the prod profile
      # overrides them with SPRING_REDIS_HOST/SPRING_REDIS_PORT
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  # Local: el broker del docker-compose publica 9094 al host. Dentro de Docker/k8s: kafka:9092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      # Pushes y peticiones de traducción del microservicio de notificaciones (modo remote)
      auto-offset-reset: earliest

# Dónde se envían las notificaciones:
#   local  → dentro del monolito (por defecto, comportamiento de siempre)
#   remote → se publican en Kafka y las envía el microservicio notification-service
notification:
  mode: ${NOTIFICATION_MODE:local}

# ── Outbox relay ──────────────────────────────────────────────────────────────
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
    interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    # Al llegar a este número de fallos el evento queda FAILED (antes 5 y se daba por procesado)
    max-retries: ${OUTBOX_RELAY_MAX_RETRIES:10}
    # Backoff exponencial entre reintentos: 1 s, 2 s, 4 s... con tope de 5 min (~17 min con 10 reintentos)
    backoff-initial-ms: ${OUTBOX_RELAY_BACKOFF_INITIAL_MS:1000}
    backoff-max-ms: ${OUTBOX_RELAY_BACKOFF_MAX_MS:300000}

# ── Consumidores de eventos de dominio (Kafka) ────────────────────────────────
# Si un mensaje falla se reintenta con backoff hasta max-retry-ms; ver DomainEventsConsumerConfig.
messaging:
  consumers:
    enabled: ${MESSAGING_CONSUMERS_ENABLED:true}
    max-retry-ms: ${MESSAGING_CONSUMERS_MAX_RETRY_MS:1800000}

# Clave que los servicios envían en X-Internal-Api-Key para usar /internal/**. Vacía = /internal cerrado.
app:
  # Identidad (usuarios, sesiones, perfiles y temas) vive en identity-service: aquí solo se verifican
  # sus tokens con su JWK Set y se consulta su API interna (con app.internal.api-key)
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8088}
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8088/.well-known/jwks.json}
  internal:
    api-key: ${INTERNAL_API_KEY:}

server:
  port: 8080

# Bloqueo de cuenta por intentos fallidos de login

# Conciliación de pagos PENDING sin webhook
payment:
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    pending-threshold-minutes: ${PAYMENT_RECONCILIATION_THRESHOLD_MINUTES:15}
    # Pago aún PENDING en la pasarela pasado este plazo: se cancela y se liberan los asientos
    expire-after-minutes: ${PAYMENT_RECONCILIATION_EXPIRE_MINUTES:30}
    cron: ${PAYMENT_RECONCILIATION_CRON:0 */5 * * * *}

# Límite por IP en login, registro, recuperación y activación de cuenta

# Translation configuration
translation:
  # Dónde se hacen las traducciones automáticas:
  #   local  → núcleo de traducción dentro del monolito (por defecto); usa el resto de este bloque
  #   remote → las hace el servicio de localización: se le piden por Kafka y los resultados
  #            vuelven por Kafka. Va junto con TRANSLATION_ENABLED=true en geolocation-service;
  #            si ambos procesaran, competirían por los mismos trabajos de translation_job.
  mode: ${TRANSLATION_MODE:local}
  provider: libretranslate
  protected-terms: ${TRANSLATION_PROTECTED_TERMS:Tu Evento}
  max-attempts: 3
  processing-timeout-minutes: 10
  libretranslate:
    base-url: ${TRANSLATION_LIBRETRANSLATE_BASE_URL:http://localhost:5001}
    timeout:
      connect: 10s
      read: 30s
  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
  backoff:
    max-minutes: 60
