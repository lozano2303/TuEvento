server:
  port: ${GEOLOCATION_SERVICE_PORT:8087}

spring:
  application:
    name: geolocation-service
  # Misma base de datos que el monolito: department, city y site las crea y migra su
  # Liquibase (también los datos iniciales). event y profile siguen leyéndolas desde el monolito.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/tuevento_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pocas conexiones: comparte el límite de la base con el monolito
      maximum-pool-size: ${GEOLOCATION_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # Falla al arrancar si las entidades no coinciden con las tablas del monolito
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: false
  # Órdenes de traducción del monolito y resultados de vuelta (solo con translation.enabled).
  # Local: el broker del docker-compose publica 9094 al host. Dentro de Docker: kafka:9092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
  # Lista de revocación de access tokens que escribe Identidad (la misma instancia de Redis que el monolito)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Se consulta en cada petición y falla cerrada: responder 503 rápido en vez de esperar 60 s
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8088/.well-known/jwks.json}

# Núcleo de traducción automática (LibreTranslate). Es el único que traduce: el monolito le pide
# las traducciones por Kafka. TRANSLATION_ENABLED=false lo apaga (sedes e idiomas siguen sirviéndose).
translation:
  enabled: ${TRANSLATION_ENABLED:true}
  provider: libretranslate
  protected-terms: ${TRANSLATION_PROTECTED_TERMS:Tu Evento}
  max-attempts: 3
  processing-timeout-minutes: 10
  libretranslate:
    base-url: ${TRANSLATION_LIBRETRANSLATE_BASE_URL:http://localhost:5001}
    timeout:
      connect: 10s
      read: 30s
  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
  backoff:
    max-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # El estado (UP/DOWN) es público para los healthchecks; el detalle, solo autenticado
      show-details: when-authorized

logging:
  level:
    com.capysoft.geolocation: INFO
