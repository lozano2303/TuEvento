server:
  port: ${STORAGE_SERVICE_PORT:8085}

spring:
  application:
    name: storage-service
  # Misma base de datos que el monolito: las tablas stored_file, file_category,
  # storage_provider y storage_operation_log las crea y migra el Liquibase del monolito.
  # Este servicio solo las lee y escribe; por eso no tiene Liquibase propio.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/tuevento_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pocas conexiones: comparte el límite de la base con el monolito
      maximum-pool-size: ${STORAGE_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # Falla al arrancar si las entidades no coinciden con las tablas del monolito
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # Lista de revocación de access tokens que escribe Identidad (la misma instancia de Redis que el monolito)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

app:
  storage:
    # Mismo proveedor, bucket y credenciales que el monolito: los dos leen y escriben los mismos objetos
    provider: ${STORAGE_PROVIDER:minio}
    bucket-default: ${STORAGE_BUCKET:tuevento}
    # MinIO (provider=minio)
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    region: ${AWS_REGION:us-east-1}
    # RustFS (provider=rustfs)
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://localhost:9100}
      public-url: ${RUSTFS_PUBLIC_URL:${RUSTFS_ENDPOINT:http://localhost:9100}}
      access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
      secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
      region: ${AWS_REGION:us-east-1}

# Host de MinIO alcanzable desde el navegador: firma las presigned URLs
minio:
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

moderation:
  nsfw:
    url: ${NSFW_SERVICE_URL:http://localhost:8001}
    threshold: ${NSFW_THRESHOLD:0.4}
  sightengine:
    api-user: ${SIGHTENGINE_API_USER:}
    api-secret: ${SIGHTENGINE_API_SECRET:}
    models: ${SIGHTENGINE_MODELS:gore,nudity,weapon}
    threshold: ${SIGHTENGINE_THRESHOLD:0.4}
    nudity-threshold: ${SIGHTENGINE_NUDITY_THRESHOLD:0.15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # El estado (UP/DOWN) es público para los healthchecks; el detalle, solo autenticado
      show-details: when-authorized

logging:
  level:
    com.capysoft.storage: INFO
