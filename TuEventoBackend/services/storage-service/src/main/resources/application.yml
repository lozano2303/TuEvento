server:
  port: ${STORAGE_SERVICE_PORT:8085}

spring:
  application:
    name: storage-service
  datasource:
    url: ${STORAGE_DB_URL:jdbc:postgresql://localhost:5432/tuevento_storage}
    username: ${STORAGE_DB_USER:postgres}
    password: ${STORAGE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  storage:
    # Strategy de almacenamiento: solo rustfs tiene configuración en este servicio
    provider: ${APP_STORAGE_PROVIDER:rustfs}
    bucket-default: ${STORAGE_BUCKET:tuevento}
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://localhost:9100}
      public-url: ${RUSTFS_PUBLIC_URL:http://localhost:9100}
      access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
      secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
      region: ${AWS_REGION:us-east-1}

moderation:
  nsfw:
    url: ${NSFW_SERVICE_URL:http://localhost:8001}
    threshold: ${NSFW_THRESHOLD:0.4}
  sightengine:
    api-user: ${SIGHTENGINE_API_USER:}
    api-secret: ${SIGHTENGINE_API_SECRET:}
    models: ${SIGHTENGINE_MODELS:gore,nudity,weapon}
    threshold: ${SIGHTENGINE_THRESHOLD:0.4}
    nudity-threshold: ${SIGHTENGINE_NUDITY_THRESHOLD:0.15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.capysoft.storage: INFO
