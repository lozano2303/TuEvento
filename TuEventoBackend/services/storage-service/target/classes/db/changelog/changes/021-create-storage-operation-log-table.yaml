databaseChangeLog:
  - changeSet:
      id: 021-create-storage-operation-log-table
      author: capysoft
      changes:
        - createTable:
            tableName: storage_operation_log
            columns:
              - column:
                  name: storage_operation_log_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: stored_file_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: performed_by
                  type: INT
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(512)
              - column:
                  name: detail
                  type: TEXT
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: storage_operation_log
            baseColumnNames: stored_file_id
            referencedTableName: stored_file
            referencedColumnNames: stored_file_id
            constraintName: fk_storage_operation_log_stored_file
