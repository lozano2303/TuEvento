server:
  port: ${STORAGE_SERVICE_PORT:8085}

spring:
  application:
    name: storage-service
  datasource:
    url: ${STORAGE_DB_URL:jdbc:postgresql://localhost:5432/tuevento_storage}
    username: ${STORAGE_DB_USER:postgres}
    password: ${STORAGE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.capysoft.storage: INFO
